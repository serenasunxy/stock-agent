name: 每日简报自动刷新

on:
  schedule:
    - cron: '0 17 * * 1-5'   # 周一至周五 UTC 17:00 = PST 9:00 AM
  workflow_dispatch:           # 支持手动触发

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pytz -q

      - name: 生成今日简报并更新页面
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 .github/scripts/refresh.py

      - name: Commit & Push
        run: |
          git config user.name "股神基米 Bot"
          git config user.email "bot@gujishen.ai"
          git add index.html
          git diff --staged --quiet || git commit -m "📈 每日更新 $(TZ='America/Los_Angeles' date '+%Y-%m-%d %H:%M PST')"
          git push
